<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- 背景 -->
  <rect width="640" height="360" fill="#87CEEB"/>
  
  <!-- 网球场地 -->
  <rect x="100" y="200" width="440" height="160" fill="#228B22"/>
  <line x1="100" y1="280" x2="540" y2="280" stroke="white" stroke-width="2"/>
  <line x1="320" y1="200" x2="320" y2="360" stroke="white" stroke-width="2"/>
  
  <!-- 网球运动员轮廓 - 正手击球姿势 -->
  <!-- 头部 -->
  <circle cx="280" cy="100" r="15" fill="#FFD5B4"/>
  
  <!-- 身体 -->
  <line x1="280" y1="115" x2="280" y2="180" stroke="#FFD5B4" stroke-width="20"/>
  
  <!-- 左臂（持拍手）- 伸展击球 -->
  <line x1="280" y1="130" x2="350" y2="140" stroke="#FFD5B4" stroke-width="12"/>
  <circle cx="360" cy="142" r="8" fill="#FFD5B4"/>
  
  <!-- 右臂（辅助手）-->
  <line x1="280" y1="130" x2="240" y2="160" stroke="#FFD5B4" stroke-width="12"/>
  <circle cx="235" cy="165" r="8" fill="#FFD5B4"/>
  
  <!-- 左腿 -->
  <line x1="275" y1="180" x2="260" y2="240" stroke="#FFD5B4" stroke-width="15"/>
  <ellipse cx="260" cy="250" rx="12" ry="6" fill="#333"/>
  
  <!-- 右腿 -->
  <line x1="285" y1="180" x2="310" y2="235" stroke="#FFD5B4" stroke-width="15"/>
  <ellipse cx="310" cy="245" rx="12" ry="6" fill="#333"/>
  
  <!-- 球拍 -->
  <line x1="360" y1="142" x2="420" y2="148" stroke="#8B4513" stroke-width="4"/>
  <ellipse cx="435" cy="150" rx="25" ry="30" fill="#00CED1" transform="rotate(-10 435 150)"/>
  
  <!-- 网球 -->
  <circle cx="460" cy="145" r="8" fill="#FFFF00" stroke="#orange" stroke-width="1"/>
  
  <!-- 网球轨迹 -->
  <path d="M 500 120 Q 480 130 460 145" stroke="yellow" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- 关键点标注 (将在PoseVisualization中绘制) -->
  <text x="50" y="350" font-family="Arial" font-size="14" fill="#333">
    Tennis Forehand - Frame 1 (1.2s)
  </text>
</svg>
